<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Switch Map</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Switch Map</div>
    <nav id="tabs" aria-label="Switches"></nav>
    <div class="actions">
      <button id="btn-undo" title="Undo (Ctrl/⌘+Z)">Undo</button>
      <button id="btn-import">Import OS9…</button>
      <button id="btn-open">Open…</button>
      <button id="btn-csv" title="Export the current switch as CSV">Export CSV</button>
      <button id="btn-save" class="primary" title="Save all switches to a .switchmap.json file (Ctrl/⌘+S)">Save</button>
    </div>
  </header>

  <main id="app">
    <section id="main">
      <div id="sw-header"></div>
      <div id="face"></div>
      <div id="legend"></div>
      <div id="table"></div>
    </section>
    <aside id="editor"></aside>
  </main>

  <dialog id="dlg"></dialog>
  <dialog id="ask"></dialog>
  <div id="tip" role="tooltip"></div>
  <div id="toast" role="status"></div>
  <input type="file" id="file-open" accept=".json,application/json" hidden>

  <script src="os9.js"></script>
  <script src="sample.js"></script>
  <script src="app.js"></script>
</body>
</html>
